<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>· galz' stuff >_< ·</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    @font-face {
      font-family: 'M8X11';
      src: url('https://files.catbox.moe/0gpr64.ttf') format('truetype');
    }
  
    :root {
      --bg: #1a1410;
      --bg-secondary: #2b211a;
      --card-bg: linear-gradient(135deg, #4b3728 0%, #3d2e20 100%);
      --primary: #c69c6d;
      --accent: #8c6a4f;
      --text: #f5e8d3;
      --glow: rgba(198, 156, 109, 0.3);
      --radius: 20px;
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }
  
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
  
    body {
      font-family: 'M8X11', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(198, 156, 109, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(140, 106, 79, 0.1) 0%, transparent 50%);
      pointer-events: none;
      animation: bgShift 15s ease-in-out infinite;
      z-index: 0;
    }

    @keyframes bgShift {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    .container {
      position: relative;
      z-index: 1;
      padding: 2rem;
      max-width: 1600px;
      margin: 0 auto;
    }
  
    .header {
      text-align: center;
      margin-bottom: 3rem;
      animation: fadeInDown 1s ease forwards;
      position: relative;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      animation: glowPulse 2s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 10px var(--glow); }
      50% { box-shadow: 0 0 25px var(--glow); }
    }
  
    .header-img-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 1.5rem;
    }

    .header-img-wrapper::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: linear-gradient(45deg, var(--primary), var(--accent));
      opacity: 0.3;
      filter: blur(20px);
      animation: rotate 10s linear infinite;
    }

    @keyframes rotate {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .header img {
      position: relative;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 3px solid var(--primary);
      box-shadow: 0 0 30px var(--glow);
      transition: transform 0.3s ease;
    }

    .header img:hover {
      transform: scale(1.05);
    }
  
    .header h1 {
      font-size: 3rem;
      background: linear-gradient(135deg, var(--primary) 0%, #e3b97f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 30px var(--glow);
    }
  
    .lang-toggle {
      margin-top: 1.5rem;
      padding: 0.8rem 1.8rem;
      border: 2px solid var(--primary);
      background: transparent;
      color: var(--primary);
      border-radius: 50px;
      font-family: 'M8X11', sans-serif;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1rem;
      position: relative;
      overflow: hidden;
      min-height: 44px;
      touch-action: manipulation;
    }

    .lang-toggle::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: var(--primary);
      transition: width 0.4s ease, height 0.4s ease;
      transform: translate(-50%, -50%);
      z-index: -1;
    }

    .lang-toggle:hover::before {
      width: 300px;
      height: 300px;
    }

    .lang-toggle:hover {
      color: var(--bg);
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 5px 20px var(--glow);
    }
  
    .window-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(450px, 100%), 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
      align-items: start;
    }

    .window {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.5rem;
      border: 1px solid rgba(198, 156, 109, 0.2);
      position: relative;
      overflow: visible;
      animation: fadeInUp 0.7s ease forwards;
      opacity: 0;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      min-height: 200px;
    }

    .window #freecounterstat {
      margin-top: 0.5rem !important;
      line-height: 1.2 !important;
    }
    
    .window a[href*='free-counters.org'] {
      display: block;
      margin-top: 0.5rem;
      font-size: 0.85rem;
    }

    .window iframe {
      max-width: 100%;
      margin: 0.5rem 0;
    }

    .window script + br {
      display: none;
    }

    .window #freecounterstat * {
      font-size: 1.2rem !important;
      color: var(--text) !important;
    }

    .window::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(198, 156, 109, 0.1) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      height: fit-content;
    }

    .window:hover::before {
      opacity: 1;
    }

    .window:hover {
      transform: translateY(-5px);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.7), 0 0 30px var(--glow);
    }

    .window:nth-child(1) { animation-delay: 0.1s; }
    .window:nth-child(2) { animation-delay: 0.2s; }
    .window:nth-child(3) { animation-delay: 0.3s; }
    .window:nth-child(4) { animation-delay: 0.4s; }
    .window:nth-child(5) { animation-delay: 0.5s; }
    .window:nth-child(6) { animation-delay: 0.6s; }
    .window:nth-child(7) { animation-delay: 0.7s; }
    .window:nth-child(8) { animation-delay: 0.8s; }
    .window:nth-child(9) { animation-delay: 0.9s; }
    .window:nth-child(10) { animation-delay: 1s; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  
    .window h2 {
      font-size: 1.8rem;
      margin-bottom: 1.2rem;
      color: var(--primary);
      position: relative;
      display: inline-block;
      padding-bottom: 0.5rem;
    }

    .window h2::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 60%;
      height: 2px;
      background: linear-gradient(90deg, var(--primary), transparent);
    }
  
    .window p, .window li {
      font-size: 1rem;
      line-height: 1.7;
      margin-bottom: 0.8rem;
    }

    .window ul {
      list-style: none;
      padding: 0;
    }

    .window li {
      margin-left: 1.5rem;
      position: relative;
    }

    .window li::before {
      content: '▹';
      position: absolute;
      left: -1.2rem;
      color: var(--primary);
    }

    .window img {
      width: 100%;
      border-radius: 12px;
    }

    .btn {
      margin-top: 1rem;
      padding: 0.9rem 1.8rem;
      background: var(--primary);
      color: var(--bg);
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1.05rem;
      font-weight: bold;
      font-family: 'M8X11', sans-serif;
      transition: all 0.3s ease;
      display: inline-block;
      position: relative;
      overflow: hidden;
      min-height: 44px;
      touch-action: manipulation;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transition: width 0.4s ease, height 0.4s ease;
      transform: translate(-50%, -50%);
    }

    .btn:hover::before {
      width: 300px;
      height: 300px;
    }

    .btn:hover {
      background: #a87d50;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(198, 156, 109, 0.4);
    }
  
    .social-link {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      text-decoration: none;
      color: var(--text);
      padding: 0.8rem;
      border-radius: 10px;
      transition: all 0.3s ease;
      margin-bottom: 0.5rem;
      position: relative;
      overflow: hidden;
      min-height: 44px;
      font-size: 0.95rem;
    }

    .social-link::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 3px;
      background: var(--primary);
      transform: scaleY(0);
      transition: transform 0.3s ease;
    }

    .social-link:hover::before {
      transform: scaleY(1);
    }

    .social-link:hover {
      background: rgba(198, 156, 109, 0.1);
      padding-left: 1rem;
      color: var(--primary);
    }

    .social-link i {
      font-size: 1.2rem;
    }

    audio {
      width: 100%;
      outline: none;
      border-radius: 12px;
      margin-top: 1rem;
      filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.3));
    }

    .music-controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 1rem;
    }

    .music-controls button {
      padding: 0.8rem 1.5rem;
      background: rgba(198, 156, 109, 0.2);
      border: 1px solid var(--primary);
      color: var(--primary);
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1.2rem;
      font-family: 'M8X11', sans-serif;
      min-width: 50px;
      min-height: 44px;
    }

    .music-controls button:hover {
      background: var(--primary);
      color: var(--bg);
      transform: scale(1.1);
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 1rem;
      border-radius: 12px;
      border: 2px solid rgba(198, 156, 109, 0.3);
      background: rgba(43, 33, 26, 0.5);
      color: var(--text);
      font-family: 'M8X11', sans-serif;
      margin-top: 0.8rem;
      transition: all 0.3s ease;
      font-size: 1rem;
      min-height: 44px;
    }

    input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 15px var(--glow);
    }

    .messages-container {
      max-height: 300px;
      overflow-y: auto;
      padding: 1rem;
      border: 2px solid rgba(198, 156, 109, 0.3);
      border-radius: 12px;
      background: rgba(43, 33, 26, 0.3);
      margin-top: 1rem;
    }

    .messages-container::-webkit-scrollbar {
      width: 8px;
    }

    .messages-container::-webkit-scrollbar-track {
      background: rgba(43, 33, 26, 0.5);
      border-radius: 10px;
    }

    .messages-container::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 10px;
    }

    .message-item {
      padding: 0.8rem;
      background: rgba(255, 255, 255, 0.05);
      border-left: 3px solid var(--primary);
      border-radius: 8px;
      margin-bottom: 0.8rem;
      transition: all 0.3s ease;
    }

    .message-item:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateX(5px);
    }

    .blog-container {
      max-height: 300px;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .blog-container::-webkit-scrollbar {
      width: 8px;
    }

    .blog-container::-webkit-scrollbar-track {
      background: rgba(43, 33, 26, 0.5);
      border-radius: 10px;
    }

    .blog-container::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 10px;
    }

    .blog-entry {
      padding: 1rem;
      border-left: 3px solid var(--primary);
      margin-bottom: 1.5rem;
      margin-right: 5px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .blog-entry:hover {
      background: rgba(255, 255, 255, 0.07);
      transform: translateX(5px);
    }

    .blog-entry strong {
      color: var(--primary);
      font-size: 1.1rem;
    }

    .blog-entry small {
      opacity: 0.7;
    }

    #discordStatus {
      width: 100%;
      border-radius: 12px;
      transition: transform 0.3s ease;
    }

    #discordStatus:hover {
      transform: scale(1.02);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .toggle-btn {
      width: 100%;
      padding: 0.8rem;
      background: rgba(198, 156, 109, 0.2);
      border: 2px solid var(--primary);
      color: var(--primary);
      border-radius: 12px;
      cursor: pointer;
      font-family: 'M8X11', sans-serif;
      font-size: 1.3rem;
      transition: all 0.3s ease;
      margin-top: 0.8rem;
      min-height: 44px;
      touch-action: manipulation;
    }

    .toggle-btn:hover {
      background: var(--primary);
      color: var(--bg);
    }

    @media (max-width: 768px) {
      .container {
        padding: 1rem;
      }

      .window-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      .window {
        padding: 1.5rem;
      }

      .header h1 {
        font-size: 2rem;
      }

      .header img {
        width: 150px;
        height: 150px;
      }

      .header-img-wrapper::before {
        width: 170px;
        height: 170px;
      }

      .social-link {
        font-size: 1rem;
        padding: 1rem;
      }

      .music-controls {
        gap: 0.8rem;
      }

      .music-controls button {
        padding: 1rem;
        font-size: 1.1rem;
      }

      #nowPlaying {
        font-size: 0.9rem;
        word-break: break-word;
      }

      .window h2 {
        font-size: 1.5rem;
      }

      .messages-container {
        font-size: 0.95rem;
      }

      .blog-entry {
        font-size: 0.95rem;
      }
    }

    @media (max-width: 480px) {
      .header h1 {
        font-size: 1.7rem;
      }

      .window {
        padding: 1.2rem;
      }

      .social-link span {
        font-size: 0.9rem;
      }

      .window h2 {
        font-size: 1.3rem;
      }
    }

    @media (hover: none) {
      .window:hover {
        transform: none;
      }

      .social-link:active {
        background: rgba(198, 156, 109, 0.2);
      }

      .btn:active {
        transform: scale(0.98);
      }
    }

    .window img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
    }

    .social-link i {
      flex-shrink: 0;
    }

    audio {
      width: 100%;
      max-width: 100%;
    }

    * {
      -webkit-tap-highlight-color: transparent;
    }

    button, a, input, textarea {
      -webkit-user-select: none;
      user-select: none;
    }

    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>· galz stuff ·</h1>
    </div>

    <div class="window-grid">
      <div class="window">
        <h2 id="aboutTitle">wow. that's a wrap.</h2>
        <p id="aboutText">quickly hold on, folks, as we'll return with a new, more impressive and less bloated website!!1!11!!!</p>
      </div>
    </div>
  </div>
</body>
</html>
